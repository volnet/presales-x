<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" data-state="entrance">
    <div id="bubble" class="bubble" aria-live="polite" hidden></div>
    <div id="robotHitbox" class="robot-hitbox" aria-hidden="true">
      <svg id="robot" viewBox="0 0 200 190" aria-hidden="true">
        <defs>
          <linearGradient id="shibaFur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a414c"/><stop offset=".42" stop-color="#171c24"/><stop offset="1" stop-color="#070a0f"/></linearGradient>
          <linearGradient id="creamFur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c088"/><stop offset="1" stop-color="#c8793c"/></linearGradient>
          <radialGradient id="eye" cx=".36" cy=".28" r=".8"><stop offset="0" stop-color="#4c6689"/><stop offset=".18" stop-color="#16253b"/><stop offset="1" stop-color="#03070d"/></radialGradient>
          <filter id="softShadow" x="-50%" y="-50%" width="200%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
        </defs>
        <ellipse class="shadow" cx="101" cy="176" rx="54" ry="8" fill="#263b56" opacity=".17" filter="url(#softShadow)"/>
        <g class="tail"><path d="M146 118c35-2 34-41 11-40-15 1-15 19-4 20 10 1 14-9 10-16" fill="none" stroke="url(#shibaFur)" stroke-width="16" stroke-linecap="round"/><path d="M158 84c7-2 10 4 8 9" fill="none" stroke="#d58a4a" stroke-width="5" stroke-linecap="round"/></g>
        <g class="body">
          <g class="leg leg-left"><path d="M65 132c-4 13-5 27-2 36 7 5 18 5 25 0l-2-37z" fill="url(#shibaFur)"/><ellipse cx="75" cy="169" rx="15" ry="7" fill="url(#creamFur)"/></g>
          <g class="leg leg-right"><path d="M113 132c-2 14-1 28 2 36 8 5 19 4 25-2l-7-38z" fill="url(#shibaFur)"/><ellipse cx="127" cy="168" rx="15" ry="7" fill="url(#creamFur)"/></g>
          <g class="torso"><path d="M55 103c8-17 28-25 47-23 22 1 41 14 46 36l-8 34c-23 17-57 17-80 0z" fill="url(#shibaFur)" stroke="#05070b" stroke-width="1.5"/><path d="M78 105c10-7 27-7 38 0 0 17-5 33-19 45-15-11-20-27-19-45z" fill="#e6ae72"/><path class="bandana" d="M62 103c24 10 51 10 75 0l-5 13c-22 8-43 8-65 0z" fill="#1261e8"/><path class="badge" d="M92 108l8-5 8 5-8 10z" fill="#dff5ff" stroke="#5bd4ff"/></g>
          <g class="arm arm-left"><path d="M60 111c-13 4-19 14-18 27 2 8 12 10 18 4l12-24z" fill="url(#shibaFur)"/><ellipse cx="48" cy="140" rx="10" ry="8" fill="url(#creamFur)"/></g>
          <g class="arm arm-right"><path d="M139 111c13 3 20 13 19 26-2 8-12 11-18 5l-13-24z" fill="url(#shibaFur)"/><ellipse cx="152" cy="140" rx="10" ry="8" fill="url(#creamFur)"/></g>
          <g class="head">
            <g class="ear ear-left"><path d="M48 53L58 12l29 31z" fill="url(#shibaFur)" stroke="#05070b"/><path d="M57 45l4-23 16 19z" fill="#a9584e"/></g>
            <g class="ear ear-right"><path d="M112 42l30-30 9 44z" fill="url(#shibaFur)" stroke="#05070b"/><path d="M122 41l17-19 4 25z" fill="#a9584e"/></g>
            <path d="M47 56c8-24 30-34 53-34s47 11 54 37c7 27-10 54-36 63-23 8-52 1-66-18-10-13-11-32-5-48z" fill="url(#shibaFur)" stroke="#05070b" stroke-width="1.5"/>
            <path d="M58 82c7-14 20-19 40-13 19-7 35-2 43 13 3 16-9 32-25 38-16 6-34 4-47-7-10-8-15-20-11-31z" fill="url(#creamFur)"/>
            <ellipse class="tan-brow" cx="75" cy="48" rx="9" ry="5" fill="#cf7f40" transform="rotate(-8 75 48)"/><ellipse class="tan-brow" cx="125" cy="48" rx="9" ry="5" fill="#cf7f40" transform="rotate(8 125 48)"/>
            <g class="face face-awake"><ellipse cx="75" cy="70" rx="13" ry="16" fill="url(#eye)"/><ellipse cx="124" cy="70" rx="13" ry="16" fill="url(#eye)"/><circle cx="70" cy="64" r="4.5" fill="#fff"/><circle cx="119" cy="64" r="4.5" fill="#fff"/><circle cx="78" cy="75" r="2" fill="#78d8ff"/><circle cx="127" cy="75" r="2" fill="#78d8ff"/></g>
            <g class="face face-sleep" fill="none" stroke="#3a2a25" stroke-width="4" stroke-linecap="round"><path d="M64 73q11 8 22 0"/><path d="M113 73q11 8 22 0"/></g>
            <g class="face face-think"><ellipse cx="75" cy="70" rx="11" ry="14" fill="url(#eye)"/><ellipse cx="126" cy="67" rx="12" ry="15" fill="url(#eye)"/><circle cx="71" cy="65" r="4" fill="#fff"/><circle cx="122" cy="61" r="4" fill="#fff"/></g>
            <ellipse cx="100" cy="91" rx="17" ry="12" fill="#eeb67c" opacity=".72"/>
            <path class="nose" d="M90 87q10-8 20 0-1 9-10 10-9-1-10-10z" fill="#171216" stroke="#08070a" stroke-width="1.5"/><ellipse cx="96" cy="87" rx="3.2" ry="2" fill="#fff" opacity=".35"/>
            <path class="mouth" d="M100 97v5m0 0q-8 8-14 1m14-1q8 8 14 1" fill="none" stroke="#35231f" stroke-width="2.7" stroke-linecap="round"/>
            <path class="tongue" d="M93 104q7 16 14 0-7 4-14 0z" fill="#f1818b" stroke="#a84e57" stroke-width="1.4"/>
            <circle cx="53" cy="94" r="6" fill="#d97970" opacity=".42"/><circle cx="145" cy="94" r="6" fill="#d97970" opacity=".42"/>
          </g>
        </g>
        <g class="idea"><circle cx="158" cy="44" r="10" fill="#fff7b1" stroke="#efb600"/><path d="M158 25v-8m18 13 6-6m-3 20h9" stroke="#efb600" stroke-width="3" stroke-linecap="round"/></g>
        <g class="zzz" fill="#6295e8" font-family="Arial,sans-serif" font-weight="800"><text x="148" y="56" font-size="13">Z</text><text x="161" y="40" font-size="18">Z</text></g>
      </svg>
    </div>
    <button id="petInteract" class="pet-interact" type="button" tabindex="-1" aria-label="与柴犬数字宠物互动"></button>
  </main>
  <script src="app.js"></script>
</body>
</html>
